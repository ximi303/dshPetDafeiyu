; ==========================================================
; ESP32 桌宠固件 —— PlatformIO 工程配置
; 硬件：ESP32-S3-WROOM-1-N16R8（16MB Flash + 8MB PSRAM，Octal PSRAM）
;       320×240 ST7789 / ILI9341（SPI）
; 阶段 1：动画烧在 Flash 的 storage 分区（LittleFS 11.9MB），不接 SD 卡
; 阶段 2：把 STORAGE_BACKEND 改成 1 即可切到 SD 卡，上层代码不用动
; ==========================================================

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---- Flash / PSRAM ----
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
; SPIFFS 不支持真目录（扁平结构），而 pack 是按分类分目录放的 → 必须用 LittleFS
board_build.filesystem = littlefs
; N16R8 是 Octal PSRAM，配成 qio_qspi 会导致 PSRAM 不可用（双缓冲直接分配失败）
board_build.arduino.memory_type = qio_opi

; ---- 编译标志 ----
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DSTORAGE_BACKEND=0
    ; STORAGE_BACKEND: 0 = Flash(LittleFS)  1 = SD 卡

; ---- 依赖 ----
; LovyanGFX：屏驱动 + DMA 刷屏
; JPEGDEC   ：JPEG 软解，内置 ESP32-S3 SIMD 汇编，支持从 FLASH 内存直解
lib_deps =
    lovyan03/LovyanGFX
    bitbank2/JPEGDEC

; ---- 烧录与串口 ----
; 不写这行的话 elf2image 会按板子默认写 --flash_size 8MB，与 16MB 实盘不符
board_upload.flash_size = 16MB
; 走外置 UART 桥时最高 921600；用 S3 原生 USB-Serial-JTAG 则不受此限制
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
